[package]
name = "tower-content-negotiation"
description = "Tower response content negotiation middleware"
repository = "https://github.com/jkobz/tower-content-negotiation"
readme = "README.md"
keywords = ["tower"]
categories = ["web-programming"]
authors = ["Eugene Kobzev <jenyakobzev@gmail.com>"]
edition = "2024"
version = "1.0.0"
license = "MIT"

[dependencies]
askama = "0.14"
askama_web = { version = "0.14", features = ["axum-0.8"] }
axum = { version = "0.8.9", featurs = ["json"] }
axum-extra = { version = "0.12.6", features = ["typed-header", "form"] }
futures = "0.3.32"
mime = "0.3.17"
serde = "1.0.228"
tower-layer = "0.3.3"
tower-service = "0.3.3"
